# Publishes the DNF repository on GitHub Pages, so `sudo dnf upgrade` picks up new
# versions. The packages and the repository metadata are signed on Dino's PC with
# Dino's own OpenPGP key (packaging/fedora-glass-sign, see docs/SIGNING.md), which
# uploads them to the release as dnf-repo.tar.gz and starts this workflow. This
# workflow only checks every signature against packaging/RPM-GPG-KEY-fedora-glass on
# main and publishes; it has no key and can't sign anything. Users add it
# once with the README's install commands, which check the key's fingerprint and
# install fedora-glass from this repository (the package carries fedora-glass.repo
# and the key). The site serves RPM-GPG-KEY-fedora-glass for that. Older Liquid Glass installs added
# liquid-glass.repo by hand, which only lets through the liquid-glass package:
# from 1.5.0 each release also has a liquid-glass package that moves them over.
#
# The site serves the release and the two before it (so `dnf downgrade` can roll
# back), and never goes back to an older version than the one it serves.
name: DNF repository

on:
  # Started by fedora-glass-sign on Dino's PC once it has signed a release, or by
  # hand from the Actions tab.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.4.3"
        required: true

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The Pages address follows the repository's name.
  SITE: https://djshiye.github.io/${{ github.event.repository.name }}

jobs:
  # Before anything is published, apt and pacman themselves must accept the signed
  # Ubuntu and Arch repositories, trusting only the key on main.
  apt:
    if: github.repository == 'djshiye/fedora-glass' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c  # pinned; bump on purpose
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          sparse-checkout: packaging
      - name: apt accepts the signed repository
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "not a release tag: $TAG"; exit 1 ;; esac
          apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null
          curl -fsSLo bundle.tar.gz "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/dnf-repo.tar.gz"
          if ! tar -tzf bundle.tar.gz | grep -qx 'apt/'; then echo "::warning::no apt/ in the bundle (old fedora-glass-sign): nothing to check"; exit 0; fi
          mkdir -p /srv/site && tar -xzf bundle.tar.gz -C /srv/site --no-same-owner apt
          chmod -R a+rX /srv/site   # the signer packs owner-only files; apt reads them as _apt
          install -Dm644 packaging/RPM-GPG-KEY-fedora-glass /usr/share/keyrings/fedora-glass.asc
          # The same source line the package installs, pointed at the files from the bundle.
          sed 's|https://djshiye.github.io/fedora-glass/apt/|file:///srv/site/apt/|' packaging/deb/fedora-glass.sources > /etc/apt/sources.list.d/fedora-glass.sources
          apt-get update -o APT::Update::Error-Mode=any 2>&1 | tee update.log
          grep -qiE '^(W|E):' update.log && { echo "apt did not accept the repository"; exit 1; }
          cd /tmp && apt-get download "fedora-glass=${TAG#v}-1"   # checks the hash from the signed index
          ls -l /tmp/fedora-glass_*.deb

  pacman:
    if: github.repository == 'djshiye/fedora-glass' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: archlinux@sha256:b1c2fe6e717bfd5673af8fc217e1e1c3ce0dcbb1d53c3414c8425e7ce79fc6d9  # pinned; bump on purpose
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          sparse-checkout: packaging
      - name: pacman accepts the signed repository
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "not a release tag: $TAG"; exit 1 ;; esac
          curl -fsSLo bundle.tar.gz "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/dnf-repo.tar.gz"
          if ! tar -tzf bundle.tar.gz | grep -qx 'arch/'; then echo "::warning::no arch/ in the bundle (old fedora-glass-sign): nothing to check"; exit 0; fi
          mkdir -p /srv/site && tar -xzf bundle.tar.gz -C /srv/site --no-same-owner arch
          chmod -R a+rX /srv/site
          pacman-key --init >/dev/null
          pacman-key --add packaging/RPM-GPG-KEY-fedora-glass
          fpr="$(gpg --batch --with-colons --show-keys packaging/RPM-GPG-KEY-fedora-glass | awk -F: '$1 == "fpr" { print $10; exit }')"
          pacman-key --lsign-key "$fpr"
          printf '\n[fedora-glass]\nSigLevel = Required DatabaseRequired\nServer = file:///srv/site/arch\n' >> /etc/pacman.conf
          pacman -Sy
          pacman -Swdd --noconfirm fedora-glass        # checks the package signature too
          pacman -Si fedora-glass | grep -E "^Version +: ${TAG#v}-"

  publish:
    needs: [apt, pacman]
    # Only in this repository (never a fork), and only when run on main.
    if: github.repository == 'djshiye/fedora-glass' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80  # pinned; bump on purpose
    permissions:
      contents: read    # read tags and the repo file
      pages: write      # publish the site
      id-token: write   # required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Tools
        run: dnf install -y --setopt=install_weak_deps=False rpm gnupg2 tar gzip git-core curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0   # tags and history, to check the release below

      - name: Which release
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          git config --global --add safe.directory "$PWD"
          tag="$INPUT_TAG"
          case "$tag" in v[0-9]*) ;; *) echo "not a release tag: $tag"; exit 1 ;; esac
          # A real release: the tag exists here and is on main.
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null || { echo "no tag $tag"; exit 1; }
          git merge-base --is-ancestor "$tag" origin/main || { echo "$tag is not on main"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Get the signed repository and check every signature
        run: |
          # Signed on Dino's PC (packaging/fedora-glass-sign) and uploaded to the release
          # as dnf-repo.tar.gz. Nothing is published unless every package and the
          # repository metadata are signed by the key in packaging/RPM-GPG-KEY-fedora-glass
          # on main. The private key is never on GitHub.
          key=packaging/RPM-GPG-KEY-fedora-glass
          test -s "$key" || { echo "no $key on main"; exit 1; }
          curl -fsSLo bundle.tar.gz "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/dnf-repo.tar.gz" \
            || { echo "release $TAG has no dnf-repo.tar.gz yet: run fedora-glass-sign $TAG on Dino's PC"; exit 1; }
          # Only plain files and folders under rpms/, with plain names.
          tar -tvzf bundle.tar.gz > list.txt
          awk '{ print substr($1, 1, 1) }' list.txt | grep -qv '^[-d]$' && { echo "refusing: links or devices in the bundle"; exit 1; }
          tar -tzf bundle.tar.gz | grep -Evx 'rpms/?|rpms/repodata/?|rpms/[A-Za-z0-9._+~^-]+\.rpm|rpms/repodata/[A-Za-z0-9._-]+|apt/?|apt/[A-Za-z0-9._+~-]+|arch/?|arch/[A-Za-z0-9._+~-]+' \
            && { echo "refusing: unexpected paths in the bundle"; exit 1; }
          mkdir -p site
          tar -xzf bundle.tar.gz -C site --no-same-owner --no-same-permissions
          # Repository metadata: signed by the key on main.
          gpg --batch --dearmor < "$key" > key.gpg
          gpgv --keyring ./key.gpg site/rpms/repodata/repomd.xml.asc site/rpms/repodata/repomd.xml
          # Each package: signed by that key and nothing else trusted (a fresh rpm root).
          mkdir -p vroot
          rpmkeys --root "$PWD/vroot" --import "$key"
          for p in site/rpms/*.rpm; do
            rpmkeys --root "$PWD/vroot" --define '_pkgverify_level all' --checksig "$p"
            case "$(rpm -qp --nosignature --qf '%{name}' "$p")" in fedora-glass|liquid-glass) ;; *) echo "refusing: $p"; exit 1 ;; esac
          done
          # Ubuntu (apt) and Arch (pacman). A signer from before 1.5.16 makes only rpms/: then
          # Fedora still gets its update, and the warning says to update fedora-glass-sign.
          if ! [ -d site/apt ] || ! [ -d site/arch ]; then
            echo "::warning::$TAG was signed without the Ubuntu and Arch repositories. Update fedora-glass-sign on Dino's PC (docs/SIGNING.md) and sign $TAG again."
          else
          gpgv --keyring ./key.gpg site/apt/InRelease
          gpgv --keyring ./key.gpg site/apt/Release.gpg site/apt/Release
          for f in site/arch/*.pkg.tar.xz site/arch/fedora-glass.db site/arch/fedora-glass.db.tar.gz; do
            gpgv --keyring ./key.gpg "$f.sig" "$f"
          done
          ls site/apt/fedora-glass_"${TAG#v}"-*_all.deb site/arch/fedora-glass-"${TAG#v}"-*-any.pkg.tar.xz >/dev/null \
            || { echo "the bundle has no Ubuntu or Arch package for $TAG"; exit 1; }
          fi
          main="$(ls site/rpms/fedora-glass-"${TAG#v}"-*.noarch.rpm 2>/dev/null | head -1)"
          [ -n "$main" ] || { echo "the bundle has no fedora-glass ${TAG#v}"; exit 1; }
          echo "EVR=$(rpm -qp --nosignature --qf '%{evr}' "$main")" >> "$GITHUB_ENV"
          ls -l site/rpms

      - name: Never go back to an older version
        run: |
          code="$(curl -sSL -o served.txt -w '%{http_code}' "$SITE/version.txt")"
          case "$code" in
            200) served="$(cat served.txt)" ;;
            404) served="" ;;   # first publish
            *) echo "could not read the served version (HTTP $code)"; exit 1 ;;
          esac
          echo "served: ${served:-nothing yet}, new: $EVR"
          # Both go into an rpm Lua expression below: allow only version characters.
          for v in "$EVR" ${served:+"$served"}; do
            printf '%s' "$v" | grep -Eqx '[0-9A-Za-z.:~^_+-]+' || { echo "refusing: bad version string"; exit 1; }
          done
          if [ -n "$served" ]; then
            cmp="$(rpm --eval "%{lua: print(rpm.vercmp('$EVR', '$served'))}")"
            [ "$cmp" -ge 0 ] || { echo "refusing: $EVR is older than the served $served"; exit 1; }
          fi

      - name: Build the site
        run: |
          cp packaging/fedora-glass.repo packaging/liquid-glass.repo packaging/RPM-GPG-KEY-fedora-glass site/
          echo "$EVR" > site/version.txt
          printf '<!doctype html><meta charset="utf-8"><title>Fedora Glass repositories</title><p>Fedora Glass %s. How to install it on Fedora, Ubuntu and Arch: <a href="https://github.com/%s#install">github.com/%s</a></p>\n' "$TAG" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" > site/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

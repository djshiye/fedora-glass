# Publishes a DNF repository on GitHub Pages with the newest released RPM, so
# `sudo dnf upgrade` picks up new versions. It runs after each successful
# Release, or by hand from the Actions tab. Users add it once with:
#   sudo dnf config-manager addrepo --from-repofile=https://djshiye.github.io/fedora-liquid-glass/liquid-glass.repo
name: DNF repository

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # Only after a Release that succeeded on main, or a hand-started run on main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    container: fedora:44
    permissions:
      contents: read    # read the repo file from main
      pages: write      # publish the site
      id-token: write   # required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Tools
        run: dnf install -y --setopt=install_weak_deps=False createrepo_c rpm

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main

      - name: Newest release, checked against its SHA256SUMS
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          mkdir -p dl && cd dl
          curl -fsSLo liquid-glass.noarch.rpm "$base/liquid-glass.noarch.rpm"
          curl -fsSLo SHA256SUMS "$base/SHA256SUMS"
          grep ' liquid-glass.noarch.rpm$' SHA256SUMS | sha256sum -c -
          test "$(rpm -qp --qf '%{name}' liquid-glass.noarch.rpm)" = liquid-glass
          echo "NVR=$(rpm -qp --qf '%{name}-%{version}-%{release}' liquid-glass.noarch.rpm)" >> "$GITHUB_ENV"

      - name: Build the repository
        run: |
          mkdir -p site/fedora-44
          cp dl/liquid-glass.noarch.rpm "site/fedora-44/$NVR.noarch.rpm"
          createrepo_c site/fedora-44
          cp packaging/liquid-glass.repo site/
          printf '<!doctype html><meta charset="utf-8"><title>Liquid Glass DNF repository</title><pre>sudo dnf config-manager addrepo --from-repofile=https://djshiye.github.io/fedora-liquid-glass/liquid-glass.repo\nsudo dnf install liquid-glass</pre><p>Serving %s.</p>\n' "$NVR" > site/index.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5

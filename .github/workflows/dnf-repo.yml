# Publishes the DNF repository on GitHub Pages, so `sudo dnf upgrade` picks up new
# versions. The packages and the repository metadata are signed on Dino's PC with
# Dino's own OpenPGP key (packaging/fedora-glass-sign, see docs/SIGNING.md), which
# uploads them to the release as dnf-repo.tar.gz and starts this workflow. This
# workflow only checks every signature against packaging/RPM-GPG-KEY-fedora-glass on
# main and publishes; it has no key and can't sign anything. Users add it
# once with:
#   sudo dnf install https://github.com/djshiye/fedora-glass/releases/latest/download/fedora-glass.noarch.rpm
# (the package carries fedora-glass.repo). Older Liquid Glass installs added
# liquid-glass.repo by hand, which only lets through the liquid-glass package:
# from 1.5.0 each release also has a liquid-glass package that moves them over.
#
# The site serves the release and the two before it (so `dnf downgrade` can roll
# back), and never goes back to an older version than the one it serves.
name: DNF repository

on:
  # Started by fedora-glass-sign on Dino's PC once it has signed a release, or by
  # hand from the Actions tab.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.4.3"
        required: true

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The Pages address follows the repository's name.
  SITE: https://djshiye.github.io/${{ github.event.repository.name }}

jobs:
  publish:
    # Only in this repository (never a fork), and only when run on main.
    if: github.repository == 'djshiye/fedora-glass' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80  # pinned; bump on purpose
    permissions:
      contents: read    # read tags and the repo file
      pages: write      # publish the site
      id-token: write   # required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Tools
        run: dnf install -y --setopt=install_weak_deps=False rpm gnupg2 tar gzip git-core curl

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
          fetch-depth: 0   # tags and history, to check the release below

      - name: Which release
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          git config --global --add safe.directory "$PWD"
          tag="$INPUT_TAG"
          case "$tag" in v[0-9]*) ;; *) echo "not a release tag: $tag"; exit 1 ;; esac
          # A real release: the tag exists here and is on main.
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null || { echo "no tag $tag"; exit 1; }
          git merge-base --is-ancestor "$tag" origin/main || { echo "$tag is not on main"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Get the signed repository and check every signature
        run: |
          # Signed on Dino's PC (packaging/fedora-glass-sign) and uploaded to the release
          # as dnf-repo.tar.gz. Nothing is published unless every package and the
          # repository metadata are signed by the key in packaging/RPM-GPG-KEY-fedora-glass
          # on main. The private key is never on GitHub.
          key=packaging/RPM-GPG-KEY-fedora-glass
          test -s "$key" || { echo "no $key on main"; exit 1; }
          curl -fsSLo bundle.tar.gz "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/dnf-repo.tar.gz" \
            || { echo "release $TAG has no dnf-repo.tar.gz yet: run fedora-glass-sign $TAG on Dino's PC"; exit 1; }
          # Only plain files and folders under rpms/, with plain names.
          tar -tvzf bundle.tar.gz > list.txt
          awk '{ print substr($1, 1, 1) }' list.txt | grep -qv '^[-d]$' && { echo "refusing: links or devices in the bundle"; exit 1; }
          tar -tzf bundle.tar.gz | grep -Evx 'rpms/?|rpms/repodata/?|rpms/[A-Za-z0-9._+~^-]+\.rpm|rpms/repodata/[A-Za-z0-9._-]+' \
            && { echo "refusing: unexpected paths in the bundle"; exit 1; }
          mkdir -p site
          tar -xzf bundle.tar.gz -C site --no-same-owner --no-same-permissions
          # Repository metadata: signed by the key on main.
          gpg --batch --dearmor < "$key" > key.gpg
          gpgv --keyring ./key.gpg site/rpms/repodata/repomd.xml.asc site/rpms/repodata/repomd.xml
          # Each package: signed by that key and nothing else trusted (a fresh rpm root).
          mkdir -p vroot
          rpmkeys --root "$PWD/vroot" --import "$key"
          for p in site/rpms/*.rpm; do
            rpmkeys --root "$PWD/vroot" --define '_pkgverify_level all' --checksig "$p"
            case "$(rpm -qp --nosignature --qf '%{name}' "$p")" in fedora-glass|liquid-glass) ;; *) echo "refusing: $p"; exit 1 ;; esac
          done
          main="$(ls site/rpms/fedora-glass-"${TAG#v}"-*.noarch.rpm 2>/dev/null | head -1)"
          [ -n "$main" ] || { echo "the bundle has no fedora-glass ${TAG#v}"; exit 1; }
          echo "EVR=$(rpm -qp --nosignature --qf '%{evr}' "$main")" >> "$GITHUB_ENV"
          ls -l site/rpms

      - name: Never go back to an older version
        run: |
          code="$(curl -sSL -o served.txt -w '%{http_code}' "$SITE/version.txt")"
          case "$code" in
            200) served="$(cat served.txt)" ;;
            404) served="" ;;   # first publish
            *) echo "could not read the served version (HTTP $code)"; exit 1 ;;
          esac
          echo "served: ${served:-nothing yet}, new: $EVR"
          # Both go into an rpm Lua expression below: allow only version characters.
          for v in "$EVR" ${served:+"$served"}; do
            printf '%s' "$v" | grep -Eqx '[0-9A-Za-z.:~^_+-]+' || { echo "refusing: bad version string"; exit 1; }
          done
          if [ -n "$served" ]; then
            cmp="$(rpm --eval "%{lua: print(rpm.vercmp('$EVR', '$served'))}")"
            [ "$cmp" -ge 0 ] || { echo "refusing: $EVR is older than the served $served"; exit 1; }
          fi

      - name: Build the site
        run: |
          cp packaging/fedora-glass.repo packaging/liquid-glass.repo packaging/RPM-GPG-KEY-fedora-glass site/
          echo "$EVR" > site/version.txt
          printf '<!doctype html><meta charset="utf-8"><title>Fedora Glass DNF repository</title><pre>sudo dnf install https://github.com/%s/releases/latest/download/fedora-glass.noarch.rpm</pre><p>Serving %s.</p>\n' "$GITHUB_REPOSITORY" "$TAG" > site/index.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5

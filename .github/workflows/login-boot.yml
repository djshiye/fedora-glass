# The glass login screen on real PCs: boots a real Fedora, Ubuntu and Arch in a virtual
# machine with a real GDM, builds and installs the real package there, turns the glass on,
# logs in for real through the login screen, and breaks the glass on purpose (a crash, a
# broken add-on, nobody logging in, the package removed) to show nobody is ever locked out.
# What each step proves is in qa/vm/README.md.
#
# Runs by hand from the Actions tab, and on a pull request only when it has the "login-boot"
# label, so ordinary pushes cost nothing. One VM per job; nothing is cached.
#
# When a pull request's run starts (the "login-boot" label):
#   - a push (synchronize) starts a run when the pull request has the label, and replaces
#     the run before it;
#   - adding the "login-boot" label starts a run, and replaces the run before it;
#   - adding ANY OTHER label does nothing: it starts no VMs, and it must not cancel the ones
#     running. A run that is skipped by a job's `if` would still join the concurrency group and
#     cancel the running one, so such an event gets a group of its own (named after its run id):
#     it cancels nothing, and every job of it is skipped.
name: Login screen, real boot

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: login-boot-${{ github.ref }}${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'login-boot' && format('-other-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  boot:
    name: Real boot, ${{ matrix.distro }}
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'login-boot') && (github.event.action != 'labeled' || github.event.label.name == 'login-boot'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false      # one Linux failing still shows how the others did
      matrix:
        distro: [fedora-45, fedora-44, ubuntu-26.04, ubuntu-26.10, arch]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Let the runner use KVM
        # GitHub's Linux runners have /dev/kvm, owned by root; this rule lets the runner's
        # user open it (the usual recipe for KVM on hosted runners).
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Tools
        # QEMU, a tool for the cloud-init seed, and the keyring with Ubuntu's cloud image key.
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 qemu-utils genisoimage ubuntu-keyring gpgv gnupg openssh-client >/dev/null
          qemu-system-x86_64 --version | head -n 1

      - name: Boot, turn on, log in, break it
        env:
          DISTRO: ${{ matrix.distro }}
        run: python3 -I qa/vm/login_boot.py --distro "$DISTRO" --out "$RUNNER_TEMP/login-boot"

      - name: Keep the pictures and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: login-boot-${{ matrix.distro }}
          path: ${{ runner.temp }}/login-boot/
          retention-days: 3
          if-no-files-found: warn

# Runs the release checks (release-checks.yml), then builds the RPM and publishes it
# as a GitHub release, either when a version tag
# (v1.2.3) is pushed or when run by hand from the Actions tab (that run tags the
# commit with the version in the spec).
#
# When it succeeds, the "DNF repository" workflow (dnf-repo.yml) publishes the RPM
# to the DNF repository on GitHub Pages, so `sudo dnf upgrade` picks it up.
# Once COPR is set up (docs/COPR.md), the new tag also starts a signed COPR build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the release and upload the RPM; nothing else

jobs:
  # The desktop checks must pass first; a failed check stops the release here.
  checks:
    uses: ./.github/workflows/release-checks.yml
    permissions:
      contents: read

  rpm:
    needs: checks
    runs-on: ubuntu-latest
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80  # pinned; bump on purpose
    steps:
      - name: Tools
        run: dnf install -y --setopt=install_weak_deps=False rpm-build systemd-rpm-macros git gh python3-pytest python3-gobject

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Only from main
        # A hand-started run tags and publishes whatever it runs on: only main may ship.
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Run the release from main, not $GITHUB_REF"
          exit 1

      - name: Version
        run: |
          spec="$(rpmspec -q --qf '%{version}\n' --srpm packaging/fedora-glass.spec)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "${GITHUB_REF_NAME#v}" = "$spec" || { echo "tag $GITHUB_REF_NAME but spec says $spec"; exit 1; }
          fi
          echo "VER=$spec" >> "$GITHUB_ENV"
          echo "TAG=v$spec" >> "$GITHUB_ENV"

      - name: Tests
        run: python3 -m pytest -q tests

      - name: Build
        run: |
          git config --global --add safe.directory "$PWD"
          mkdir -p ~/rpmbuild/SOURCES
          git archive --format=tar.gz --prefix="fedora-glass-$VER/" -o ~/rpmbuild/SOURCES/fedora-glass-$VER.tar.gz HEAD
          rpmbuild -bb packaging/fedora-glass.spec
          mkdir out
          cp ~/rpmbuild/RPMS/noarch/fedora-glass-$VER-*.noarch.rpm out/
          # The same app under the old name, which moves a Liquid Glass install to fedora-glass.
          cp ~/rpmbuild/RPMS/noarch/liquid-glass-$VER-*.noarch.rpm out/
          # Fixed names too, so .../releases/latest/download/fedora-glass.noarch.rpm always works
          # (and the old liquid-glass.noarch.rpm link still leads to the current version).
          cp out/fedora-glass-$VER-*.noarch.rpm out/fedora-glass.noarch.rpm
          cp out/liquid-glass-$VER-*.noarch.rpm out/liquid-glass.noarch.rpm
          (cd out && sha256sum *.rpm > SHA256SUMS)

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Fedora Glass $VER" --notes "Install: sudo dnf install https://github.com/djshiye/fedora-glass/releases/latest/download/fedora-glass.noarch.rpm. After that, sudo dnf upgrade brings each new version. Had Liquid Glass? sudo dnf upgrade moves you to Fedora Glass by itself (run it twice) and keeps your settings."

# Runs the release checks (release-checks.yml), then builds the RPM and publishes it
# as a GitHub release, either when a version tag
# (v1.2.3) is pushed or when run by hand from the Actions tab (that run tags the
# commit with the version in the spec).
#
# The release RPMs are not signed here: Dino signs them on their own PC with
# `fedora-glass-sign` (docs/SIGNING.md), which then starts the "DNF repository"
# workflow (dnf-repo.yml) that publishes them for `sudo dnf upgrade`. Each package
# gets a GitHub build provenance attestation here, and fedora-glass-sign signs only
# packages whose attestation says this workflow built them from a commit on main.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the release and upload the packages
  actions: read     # fetch the Ubuntu and Arch packages built by the jobs above

jobs:
  # The desktop checks must pass first; a failed check stops the release here.
  checks:
    uses: ./.github/workflows/release-checks.yml
    permissions:
      contents: read

  # The Ubuntu and Arch packages (packages.yml), each installed on its own Linux first.
  packages:
    needs: checks
    uses: ./.github/workflows/packages.yml
    permissions:
      contents: read

  rpm:
    needs: [checks, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload the packages
      actions: read        # fetch the Ubuntu and Arch packages built by the jobs above
      id-token: write      # build provenance: a short-lived Sigstore certificate for this run
      attestations: write  # build provenance: store the attestations with the repository
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80  # pinned; bump on purpose
    steps:
      - name: Tools
        run: dnf install -y --setopt=install_weak_deps=False rpm-build systemd-rpm-macros git gh python3-pytest python3-gobject

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0   # main's history, for the check below

      - name: Only from main
        # Only main may ship. A hand-started run tags and publishes whatever it runs on,
        # so it must run on main; a pushed v* tag must point at a commit that is on main.
        run: |
          git config --global --add safe.directory "$PWD"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Run the release from main, not $GITHUB_REF"
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA ($GITHUB_REF) is not on main"; exit 1; }

      - name: Version
        run: |
          spec="$(rpmspec -q --qf '%{version}\n' --srpm packaging/fedora-glass.spec)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "${GITHUB_REF_NAME#v}" = "$spec" || { echo "tag $GITHUB_REF_NAME but spec says $spec"; exit 1; }
          fi
          echo "VER=$spec" >> "$GITHUB_ENV"
          echo "TAG=v$spec" >> "$GITHUB_ENV"

      # No separate test step: rpmbuild runs the whole test suite in the spec's %check,
      # on the same sources it packages, and a failure stops the release there.

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          mkdir -p ~/rpmbuild/SOURCES
          git archive --format=tar.gz --prefix="fedora-glass-$VER/" -o ~/rpmbuild/SOURCES/fedora-glass-$VER.tar.gz HEAD
          rpmbuild -bb packaging/fedora-glass.spec
          mkdir out
          cp ~/rpmbuild/RPMS/noarch/fedora-glass-$VER-*.noarch.rpm out/
          # The same app under the old name, which moves a Liquid Glass install to fedora-glass.
          cp ~/rpmbuild/RPMS/noarch/liquid-glass-$VER-*.noarch.rpm out/
          # Fixed names too, so .../releases/latest/download/fedora-glass.noarch.rpm always works
          # (and the old liquid-glass.noarch.rpm link still leads to the current version).
          cp out/fedora-glass-$VER-*.noarch.rpm out/fedora-glass.noarch.rpm
          cp out/liquid-glass-$VER-*.noarch.rpm out/liquid-glass.noarch.rpm
          # The Ubuntu and Arch packages from the jobs above, under fixed names too.
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n deb -D out
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n arch -D out
          cp out/fedora-glass_"$VER"-1_all.deb out/fedora-glass.deb
          cp out/fedora-glass-"$VER"-1-any.pkg.tar.xz out/fedora-glass.pkg.tar.xz
          (cd out && sha256sum *.rpm *.deb *.pkg.tar.xz > SHA256SUMS)

      - name: Build provenance
        # Signed proof (Sigstore, stored with the repository) that this workflow built each
        # package from this commit. fedora-glass-sign checks it before it signs anything.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            out/*.rpm
            out/*.deb
            out/*.pkg.tar.xz

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Fedora Glass $VER" --notes "How to install on Fedora, Ubuntu and Arch: https://github.com/djshiye/fedora-glass#install. After that, your normal system update (dnf upgrade, apt upgrade or pacman -Syu) brings each new version."

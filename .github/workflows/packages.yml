# Builds the Ubuntu (.deb) and Arch (.pkg.tar.xz) packages and installs each on its own Linux,
# so their dependencies are known to resolve there. The Release workflow calls this and attaches
# both to the release; a pull request with the "packages" label runs it too, and then also
# builds and installs the Fedora .rpm (the Release workflow builds its own).
name: Ubuntu and Arch packages

on:
  workflow_call:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

# A newer push to a pull request replaces the run before it, and so does adding the "packages"
# label. Adding ANY OTHER label does nothing: it starts no builds and must not cancel the ones
# running. A run that is skipped by a job's `if` would still join the concurrency group and
# cancel the running one, so such an event gets a group of its own (named after its run id):
# it cancels nothing, and every job of it is skipped. A release's package builds are never
# cancelled by another run (a called workflow's group must differ from its caller's).
concurrency:
  group: packages-${{ github.ref }}${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'packages' && format('-other-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Ubuntu package, built once and installed on Ubuntu 26.04 to prove its
  # dependencies resolve there.
  deb:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'packages') && (github.event.action != 'labeled' || github.event.label.name == 'packages'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c  # pinned; bump on purpose
    permissions:
      contents: read
    steps:
      - name: Tools
        run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates python3 appstream desktop-file-utils >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The store files are valid
        # What GNOME Software and Discover read; an invalid file is dropped without a word.
        run: |
          desktop-file-validate data/io.github.djshiye.LiquidGlass.desktop
          appstreamcli validate --no-net data/io.github.djshiye.LiquidGlass.metainfo.xml
      - name: Build
        run: |
          git config --global --add safe.directory "$PWD"
          ver="$(awk '/^Version:/ { print $2; exit }' packaging/fedora-glass.spec)"
          sh packaging/deb/build-deb.sh "$ver" out
          test "$(python3 -I packaging/repo_index.py deb-info out/fedora-glass_"$ver"-1_all.deb)" = "fedora-glass $ver-1"
      - name: Installs on Ubuntu
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./out/fedora-glass_*_all.deb >/dev/null
          fedora-glass --version
          bash qa/package-smoke.sh    # Apply, Restore and the window, as installed
          DEBIAN_FRONTEND=noninteractive apt-get remove -y -qq fedora-glass >/dev/null
          bash qa/package-smoke.sh --removed    # nothing of the glass login screen is left
      # `apt remove` takes the key away, so it must take the apt source with it, or every
      # later `apt update` fails (NO_PUBKEY). Checked from a fresh install and from an
      # upgrade off 1.5.19, the last version that had the source as a conffile.
      - name: apt update works after removal
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          check_removed() {
            test ! -e /etc/apt/sources.list.d/fedora-glass.sources && test ! -e /etc/apt/preferences.d/fedora-glass.pref
            apt-get update 2>&1 | tee /tmp/update.log
            test "${PIPESTATUS[0]}" -eq 0
            ! grep -E 'NO_PUBKEY|fedora-glass' /tmp/update.log
          }
          check_removed
          git fetch -q --depth 1 origin tag v1.5.19
          mkdir /tmp/old && git archive v1.5.19 | tar -x -C /tmp/old
          (cd /tmp/old && sh packaging/deb/build-deb.sh 1.5.19 /tmp/old-out)
          apt-get install -y -qq /tmp/old-out/fedora-glass_1.5.19-1_all.deb >/dev/null
          dpkg -i out/fedora-glass_*_all.deb
          test -f /etc/apt/sources.list.d/fedora-glass.sources && test -z "$(dpkg-query -W -f='${Conffiles}' fedora-glass)"
          apt-get remove -y -qq fedora-glass >/dev/null
          check_removed
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: deb
          path: out/*.deb
          if-no-files-found: error
          retention-days: 1

  # The Fedora package, on pull requests only (the Release workflow builds its own): built with
  # rpmbuild, its tests run, then installed and removed on Fedora 44.
  rpm:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'packages') && (github.event.action != 'labeled' || github.event.label.name == 'packages')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80  # pinned; bump on purpose
    permissions:
      contents: read
    steps:
      - name: Tools
        run: dnf install -y -q --setopt=install_weak_deps=False rpm-build systemd-rpm-macros python-rpm-macros git gh python3-pytest python3-gobject glib2-devel dconf desktop-file-utils appstream shadow-utils util-linux-core >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build
        # The tests run in %check; glib2-devel (installed above) has the GLib tools the login
        # screen tests need and dconf is what the glass login screen's helper tests read their
        # switch back with (here with Fedora's own dconf); a test that needs one must fail
        # here, not skip.
        env:
          FEDORAGLASS_REQUIRE: glib dconf
        run: |
          git config --global --add safe.directory "$PWD"
          ver="$(awk '/^Version:/ { print $2; exit }' packaging/fedora-glass.spec)"
          mkdir -p ~/rpmbuild/SOURCES out
          git archive --format=tar.gz --prefix="fedora-glass-$ver/" -o ~/rpmbuild/SOURCES/fedora-glass-$ver.tar.gz HEAD
          rpmbuild -bb packaging/fedora-glass.spec
          cp ~/rpmbuild/RPMS/noarch/*.noarch.rpm out/
      - name: Installs on Fedora
        run: |
          dnf install -y -q out/fedora-glass-[0-9]*.noarch.rpm >/dev/null
          fedora-glass --version
          test -f /usr/share/icons/fedora-glass-light/cursors/left_ptr
          test -L /usr/share/icons/fedora-glass-light/cursors/default
          bash qa/package-smoke.sh    # Apply, Restore and the window, as installed
          dnf remove -y -q fedora-glass >/dev/null
          test ! -e /usr/share/icons/fedora-glass-light
      - name: Install, upgrade and remove as dnf does
        # The same script a release runs, so it is proven here first: a clean install and
        # removal, the upgrade from the last release, the move from Liquid Glass 1.4.4 to
        # fedora-glass (nobody's look is undone), and the old-name package removed on its own.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(awk '/^Version:/ { print $2; exit }' packaging/fedora-glass.spec)"
          bash packaging/rpm-install-test.sh out "$ver" "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rpm
          path: out/*.rpm
          if-no-files-found: error
          retention-days: 1

  # The Arch package, built with makepkg and installed on Arch the same way.
  arch:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'packages') && (github.event.action != 'labeled' || github.event.label.name == 'packages'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux@sha256:b1c2fe6e717bfd5673af8fc217e1e1c3ce0dcbb1d53c3414c8425e7ce79fc6d9  # pinned; bump on purpose
    permissions:
      contents: read
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel git python appstream desktop-file-utils >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The store files are valid
        run: |
          desktop-file-validate data/io.github.djshiye.LiquidGlass.desktop
          appstreamcli validate --no-net data/io.github.djshiye.LiquidGlass.metainfo.xml
      - name: Build
        run: |
          useradd -m builder
          chown -R builder "$PWD"
          ver="$(awk '/^Version:/ { print $2; exit }' packaging/fedora-glass.spec)"
          su builder -c "git config --global --add safe.directory '$PWD' && sh packaging/arch/build-pkg.sh '$ver' out"
          test "$(python3 -I packaging/repo_index.py pkg-info out/fedora-glass-"$ver"-1-any.pkg.tar.xz)" = "fedora-glass $ver-1"
      - name: Installs on Arch
        run: |
          pacman -U --noconfirm out/fedora-glass-*-any.pkg.tar.xz >/dev/null
          fedora-glass --version
          bash qa/package-smoke.sh    # Apply, Restore and the window, as installed
          pacman -R --noconfirm fedora-glass >/dev/null
          bash qa/package-smoke.sh --removed    # nothing of the glass login screen is left
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: arch
          path: out/*.pkg.tar.xz
          if-no-files-found: error
          retention-days: 1

# Builds the Ubuntu (.deb) and Arch (.pkg.tar.xz) packages and installs each on its own Linux,
# so their dependencies are known to resolve there. The Release workflow calls this and attaches
# both to the release; a pull request with the "packages" label runs it too, and then also
# builds and installs the Fedora .rpm (the Release workflow builds its own).
name: Ubuntu and Arch packages

on:
  workflow_call:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  # The Ubuntu package, built once and installed on Ubuntu 26.04 to prove its
  # dependencies resolve there.
  deb:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'packages')
    runs-on: ubuntu-latest
    container: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c  # pinned; bump on purpose
    permissions:
      contents: read
    steps:
      - name: Tools
        run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates python3 >/dev/null
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Build
        run: |
          git config --global --add safe.directory "$PWD"
          ver="$(awk '/^Version:/ { print $2; exit }' packaging/fedora-glass.spec)"
          sh packaging/deb/build-deb.sh "$ver" out
          test "$(python3 -I packaging/repo_index.py deb-info out/fedora-glass_"$ver"-1_all.deb)" = "fedora-glass $ver-1"
      - name: Installs on Ubuntu
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./out/fedora-glass_*_all.deb >/dev/null
          fedora-glass --version
          DEBIAN_FRONTEND=noninteractive apt-get remove -y -qq fedora-glass >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: deb
          path: out/*.deb
          if-no-files-found: error
          retention-days: 1

  # The Fedora package, on pull requests only (the Release workflow builds its own): built with
  # rpmbuild, its tests run, then installed and removed on Fedora 44.
  rpm:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'packages')
    runs-on: ubuntu-latest
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80  # pinned; bump on purpose
    permissions:
      contents: read
    steps:
      - name: Tools
        run: dnf install -y -q --setopt=install_weak_deps=False rpm-build systemd-rpm-macros git python3-pytest python3-gobject >/dev/null
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Build
        run: |
          git config --global --add safe.directory "$PWD"
          ver="$(awk '/^Version:/ { print $2; exit }' packaging/fedora-glass.spec)"
          mkdir -p ~/rpmbuild/SOURCES out
          git archive --format=tar.gz --prefix="fedora-glass-$ver/" -o ~/rpmbuild/SOURCES/fedora-glass-$ver.tar.gz HEAD
          rpmbuild -bb packaging/fedora-glass.spec
          cp ~/rpmbuild/RPMS/noarch/*.noarch.rpm out/
      - name: Installs on Fedora
        run: |
          dnf install -y -q out/fedora-glass-[0-9]*.noarch.rpm >/dev/null
          fedora-glass --version
          test -f /usr/share/icons/fedora-glass-light/cursors/left_ptr
          test -L /usr/share/icons/fedora-glass-light/cursors/default
          dnf remove -y -q fedora-glass >/dev/null
          test ! -e /usr/share/icons/fedora-glass-light
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: rpm
          path: out/*.rpm
          if-no-files-found: error
          retention-days: 1

  # The Arch package, built with makepkg and installed on Arch the same way.
  arch:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'packages')
    runs-on: ubuntu-latest
    container: archlinux@sha256:b1c2fe6e717bfd5673af8fc217e1e1c3ce0dcbb1d53c3414c8425e7ce79fc6d9  # pinned; bump on purpose
    permissions:
      contents: read
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel git python >/dev/null
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Build
        run: |
          useradd -m builder
          chown -R builder "$PWD"
          ver="$(awk '/^Version:/ { print $2; exit }' packaging/fedora-glass.spec)"
          su builder -c "git config --global --add safe.directory '$PWD' && sh packaging/arch/build-pkg.sh '$ver' out"
          test "$(python3 -I packaging/repo_index.py pkg-info out/fedora-glass-"$ver"-1-any.pkg.tar.xz)" = "fedora-glass $ver-1"
      - name: Installs on Arch
        run: |
          pacman -U --noconfirm out/fedora-glass-*-any.pkg.tar.xz >/dev/null
          fedora-glass --version
          pacman -R --noconfirm fedora-glass >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: arch
          path: out/*.pkg.tar.xz
          if-no-files-found: error
          retention-days: 1

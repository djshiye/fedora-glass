# Release checks on a test desktop like Dino's (see qa/desktop/README.md), on GNOME 50 and
# GNOME 51 side by side, plus short checks on a stock Ubuntu desktop and on stock GNOME
# (alone and with Dash to Dock) on each.
#
# Runs before every release (release.yml calls it and only builds the RPM when it
# passes), by hand from the Actions tab, and on a pull request only when it has the
# "release-checks" label, so ordinary pushes cost nothing.
name: Release checks

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The test desktop image for each GNOME, built once and shared by every lane below through
  # GitHub's cache, instead of eight lanes each downloading and building it (4-8 minutes and
  # the package mirror's hiccups, eight times over). The cache entry is named after the
  # image's recipe (run.sh --image-info: a hash of everything it is built from) and the day,
  # so a change to the recipe rebuilds it at once and Ubuntu's package updates come in at
  # least once a day, as before. Caches written on main are only written by runs on main;
  # a pull request's run can read them but writes only its own.
  image:
    name: Test desktop image, GNOME ${{ matrix.gnome }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release-checks')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        gnome: ["50", "51"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Name the image
        id: info
        run: |
          qa/desktop/run.sh --gnome "${{ matrix.gnome }}" --image-info >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Already built today?
        id: cached
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/lgqa-image.tar.zst
          key: lgqa-image-gnome${{ matrix.gnome }}-${{ steps.info.outputs.recipe }}-${{ steps.info.outputs.day }}
          lookup-only: true

      - name: Build the image
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          qa/desktop/run.sh --gnome "${{ matrix.gnome }}" --build-only
          docker save "${{ steps.info.outputs.image }}" | zstd -T0 -3 -q -o "$RUNNER_TEMP/lgqa-image.tar.zst"

      - name: Share the image
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/lgqa-image.tar.zst
          key: lgqa-image-gnome${{ matrix.gnome }}-${{ steps.info.outputs.recipe }}-${{ steps.info.outputs.day }}

  desktop:
    needs: image
    name: Dino's desktop, GNOME ${{ matrix.gnome }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release-checks')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false      # one GNOME failing still shows how the other one did
      matrix:
        gnome: ["50", "51"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0          # the release tags, for the upgrade check

      - name: Name the image
        id: info
        run: |
          qa/desktop/run.sh --gnome "${{ matrix.gnome }}" --image-info >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Today's image from the image job above (or yesterday's, if the day turned in between).
      # Without one, run.sh builds it here as before; run.sh also rebuilds any image whose
      # recipe label does not match the checkout.
      - name: Get the shared image
        id: cached
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/lgqa-image.tar.zst
          key: lgqa-image-gnome${{ matrix.gnome }}-${{ steps.info.outputs.recipe }}-${{ steps.info.outputs.day }}
          restore-keys: lgqa-image-gnome${{ matrix.gnome }}-${{ steps.info.outputs.recipe }}-

      - name: Load the shared image
        if: steps.cached.outputs.cache-matched-key != ''
        run: |
          zstd -dc "$RUNNER_TEMP/lgqa-image.tar.zst" | docker load -q
          rm -f "$RUNNER_TEMP/lgqa-image.tar.zst"

      - name: Find the last release (for the upgrade check)
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' fedoraglass/__init__.py)
          last=$(git tag -l 'v*' --sort=-v:refname --merged HEAD | grep -vx "v$v" | head -n 1 || true)
          if [ -z "$last" ]; then echo "No earlier release: no upgrade check."; exit 0; fi
          echo "Upgrade check from $last to $v."
          mkdir "$RUNNER_TEMP/last-release"
          git archive "$last" | tar -x -C "$RUNNER_TEMP/last-release"
          echo "LGQA_FROM=$RUNNER_TEMP/last-release" >> "$GITHUB_ENV"

      - name: Run the checks
        run: qa/desktop/run.sh --gnome "${{ matrix.gnome }}" ${LGQA_FROM:+--from "$LGQA_FROM"} --out "$RUNNER_TEMP/qa-report"

      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/qa-report/report/report.md" ]; then
            cat "$RUNNER_TEMP/qa-report/report/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report: the test desktop did not start." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Shell log (only when a check failed)
        # The report download can't always be opened where the failure is looked at:
        # the end of GNOME Shell's log in the job log itself (a test desktop, nothing private).
        if: failure()
        run: |
          for f in shell.log watch.txt apply.txt; do
            [ -f "$RUNNER_TEMP/qa-report/$f" ] || continue
            echo "::group::$f (last 300 lines)"
            tail -n 300 "$RUNNER_TEMP/qa-report/$f"
            echo "::endgroup::"
          done

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-check-report-gnome${{ matrix.gnome }}
          path: |
            ${{ runner.temp }}/qa-report/report/
            ${{ runner.temp }}/qa-report/*.log
            ${{ runner.temp }}/qa-report/*.txt
            ${{ runner.temp }}/qa-report/*.json
          retention-days: 14
          if-no-files-found: warn

  # A new Ubuntu user's desktop as Ubuntu ships it (Ubuntu Dock, Desktop Icons, Yaru):
  # Apply and Restore original from the running desktop. Ubuntu 26.04 has GNOME 50,
  # Ubuntu 26.10 GNOME 51.
  ubuntu:
    needs: image
    name: Stock Ubuntu desktop, GNOME ${{ matrix.gnome }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release-checks')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gnome: ["50", "51"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Name the image
        id: info
        run: |
          qa/desktop/run.sh --gnome "${{ matrix.gnome }}" --image-info >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Today's image from the image job above (or yesterday's, if the day turned in between).
      # Without one, run.sh builds it here as before; run.sh also rebuilds any image whose
      # recipe label does not match the checkout.
      - name: Get the shared image
        id: cached
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/lgqa-image.tar.zst
          key: lgqa-image-gnome${{ matrix.gnome }}-${{ steps.info.outputs.recipe }}-${{ steps.info.outputs.day }}
          restore-keys: lgqa-image-gnome${{ matrix.gnome }}-${{ steps.info.outputs.recipe }}-

      - name: Load the shared image
        if: steps.cached.outputs.cache-matched-key != ''
        run: |
          zstd -dc "$RUNNER_TEMP/lgqa-image.tar.zst" | docker load -q
          rm -f "$RUNNER_TEMP/lgqa-image.tar.zst"

      - name: Run the Ubuntu checks
        run: qa/desktop/run.sh --gnome "${{ matrix.gnome }}" --ubuntu-desktop --out "$RUNNER_TEMP/qa-report"

      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/qa-report/report/report.md" ]; then
            cat "$RUNNER_TEMP/qa-report/report/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report: the test desktop did not start." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Shell log (only when a check failed)
        if: failure()
        run: |
          for f in shell.log apply.txt; do
            [ -f "$RUNNER_TEMP/qa-report/$f" ] || continue
            echo "::group::$f (last 300 lines)"
            tail -n 300 "$RUNNER_TEMP/qa-report/$f"
            echo "::endgroup::"
          done

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ubuntu-check-report-gnome${{ matrix.gnome }}
          path: |
            ${{ runner.temp }}/qa-report/report/
            ${{ runner.temp }}/qa-report/*.log
            ${{ runner.temp }}/qa-report/*.txt
          retention-days: 14
          if-no-files-found: warn

  # GNOME as it ships, as a new Fedora Workstation user has it (top bar, Activities, the
  # overview's dash and search), alone and with Dash to Dock: Apply, use the overview,
  # Restore original.
  stock:
    needs: image
    name: Stock GNOME ${{ matrix.gnome }}${{ matrix.dock && ' with Dash to Dock' || '' }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release-checks')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gnome: ["50", "51"]
        dock: [false, true]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Name the image
        id: info
        run: |
          qa/desktop/run.sh --gnome "${{ matrix.gnome }}" --image-info >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Today's image from the image job above (or yesterday's, if the day turned in between).
      # Without one, run.sh builds it here as before; run.sh also rebuilds any image whose
      # recipe label does not match the checkout.
      - name: Get the shared image
        id: cached
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/lgqa-image.tar.zst
          key: lgqa-image-gnome${{ matrix.gnome }}-${{ steps.info.outputs.recipe }}-${{ steps.info.outputs.day }}
          restore-keys: lgqa-image-gnome${{ matrix.gnome }}-${{ steps.info.outputs.recipe }}-

      - name: Load the shared image
        if: steps.cached.outputs.cache-matched-key != ''
        run: |
          zstd -dc "$RUNNER_TEMP/lgqa-image.tar.zst" | docker load -q
          rm -f "$RUNNER_TEMP/lgqa-image.tar.zst"

      - name: Run the stock GNOME checks
        run: qa/desktop/run.sh --gnome "${{ matrix.gnome }}" --stock-desktop ${{ matrix.dock && '--with-dock' || '' }} --out "$RUNNER_TEMP/qa-report"

      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/qa-report/report/report.md" ]; then
            cat "$RUNNER_TEMP/qa-report/report/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report: the test desktop did not start." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Shell log (only when a check failed)
        if: failure()
        run: |
          for f in shell.log apply.txt; do
            [ -f "$RUNNER_TEMP/qa-report/$f" ] || continue
            echo "::group::$f (last 300 lines)"
            tail -n 300 "$RUNNER_TEMP/qa-report/$f"
            echo "::endgroup::"
          done

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: stock-check-report-gnome${{ matrix.gnome }}${{ matrix.dock && '-dock' || '' }}
          path: |
            ${{ runner.temp }}/qa-report/report/
            ${{ runner.temp }}/qa-report/*.log
            ${{ runner.temp }}/qa-report/*.txt
          retention-days: 14
          if-no-files-found: warn

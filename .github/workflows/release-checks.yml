# Release checks on a test desktop like Dino's (see qa/desktop/README.md), on GNOME 50 and
# GNOME 51 side by side, plus short checks on a stock Ubuntu desktop and on stock GNOME
# (alone and with Dash to Dock) on each, and the glass login screen on a real login screen
# (GNOME Shell in its login mode) on each.
#
# Runs before every release (release.yml calls it, next to the package builds, and only
# publishes the release when it passes), by hand from the Actions tab, and on a pull
# request only when it has the "release-checks" label, so ordinary pushes cost nothing.
# The test desktop's base image is built once per GNOME version (the "image" job) and shared
# with every lane through GitHub's cache (.github/actions/test-image), not built again in each
# of the ten lanes.
#
# When a pull request's run starts (the "release-checks" label):
#   - a push (synchronize) starts a run when the pull request has the label, and replaces
#     the run before it;
#   - adding the "release-checks" label starts a run, and replaces the run before it;
#   - adding ANY OTHER label does nothing: it starts no checks, and it must not cancel the
#     checks that are running. A run that is skipped by a job's `if` would still join the
#     concurrency group and cancel the running one, so such an event gets a group of its own
#     (named after its run id): it cancels nothing, and every job of it is skipped.
name: Release checks

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'release-checks' && format('-other-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  # The test desktop image for each GNOME, built once and shared by every lane below through
  # GitHub's cache (see .github/actions/test-image). The lanes need this job, so when its gate
  # skips it (a pull request without the label, or an unrelated label just added) they are
  # skipped too.
  image:
    name: Test desktop image, GNOME ${{ matrix.gnome }}
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'release-checks') && (github.event.action != 'labeled' || github.event.label.name == 'release-checks'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        gnome: ["50", "51"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/test-image
        with:
          gnome: ${{ matrix.gnome }}
          mode: build

  desktop:
    needs: image
    name: Dino's desktop, GNOME ${{ matrix.gnome }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false      # one GNOME failing still shows how the other one did
      matrix:
        gnome: ["50", "51"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0          # the release tags, for the upgrade check

      - name: Find the last release (for the upgrade check)
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' fedoraglass/__init__.py)
          last=$(git tag -l 'v*' --sort=-v:refname --merged HEAD | grep -vx "v$v" | head -n 1 || true)
          if [ -z "$last" ]; then echo "No earlier release: no upgrade check."; exit 0; fi
          echo "Upgrade check from $last to $v."
          mkdir "$RUNNER_TEMP/last-release"
          git archive "$last" | tar -x -C "$RUNNER_TEMP/last-release"
          echo "LGQA_FROM=$RUNNER_TEMP/last-release" >> "$GITHUB_ENV"

      - uses: ./.github/actions/test-image
        with:
          gnome: ${{ matrix.gnome }}
          mode: load

      - name: Run the checks
        run: qa/desktop/run.sh --gnome "${{ matrix.gnome }}" ${LGQA_FROM:+--from "$LGQA_FROM"} --out "$RUNNER_TEMP/qa-report"

      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/qa-report/report/report.md" ]; then
            cat "$RUNNER_TEMP/qa-report/report/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report: the test desktop did not start." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Shell log (only when a check failed)
        # The report download can't always be opened where the failure is looked at:
        # the end of GNOME Shell's log in the job log itself (a test desktop, nothing private).
        if: failure()
        run: |
          for f in shell.log watch.txt apply.txt; do
            [ -f "$RUNNER_TEMP/qa-report/$f" ] || continue
            echo "::group::$f (last 300 lines)"
            tail -n 300 "$RUNNER_TEMP/qa-report/$f"
            echo "::endgroup::"
          done

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-check-report-gnome${{ matrix.gnome }}
          path: |
            ${{ runner.temp }}/qa-report/report/
            ${{ runner.temp }}/qa-report/*.log
            ${{ runner.temp }}/qa-report/*.txt
            ${{ runner.temp }}/qa-report/*.json
          retention-days: 14
          if-no-files-found: warn

  # A new Ubuntu user's desktop as Ubuntu ships it (Ubuntu Dock, Desktop Icons, Yaru):
  # Apply and Restore original from the running desktop. Ubuntu 26.04 has GNOME 50,
  # Ubuntu 26.10 GNOME 51.
  ubuntu:
    needs: image
    name: Stock Ubuntu desktop, GNOME ${{ matrix.gnome }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gnome: ["50", "51"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/test-image
        with:
          gnome: ${{ matrix.gnome }}
          mode: load

      - name: Run the Ubuntu checks
        run: qa/desktop/run.sh --gnome "${{ matrix.gnome }}" --ubuntu-desktop --out "$RUNNER_TEMP/qa-report"

      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/qa-report/report/report.md" ]; then
            cat "$RUNNER_TEMP/qa-report/report/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report: the test desktop did not start." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Shell log (only when a check failed)
        if: failure()
        run: |
          for f in shell.log apply.txt; do
            [ -f "$RUNNER_TEMP/qa-report/$f" ] || continue
            echo "::group::$f (last 300 lines)"
            tail -n 300 "$RUNNER_TEMP/qa-report/$f"
            echo "::endgroup::"
          done

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ubuntu-check-report-gnome${{ matrix.gnome }}
          path: |
            ${{ runner.temp }}/qa-report/report/
            ${{ runner.temp }}/qa-report/*.log
            ${{ runner.temp }}/qa-report/*.txt
          retention-days: 14
          if-no-files-found: warn

  # GNOME as it ships, as a new Fedora Workstation user has it (top bar, Activities, the
  # overview's dash and search), alone and with Dash to Dock: Apply, use the overview,
  # Restore original.
  stock:
    needs: image
    name: Stock GNOME ${{ matrix.gnome }}${{ matrix.dock && ' with Dash to Dock' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gnome: ["50", "51"]
        dock: [false, true]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/test-image
        with:
          gnome: ${{ matrix.gnome }}
          mode: load

      - name: Run the stock GNOME checks
        run: qa/desktop/run.sh --gnome "${{ matrix.gnome }}" --stock-desktop ${{ matrix.dock && '--with-dock' || '' }} --out "$RUNNER_TEMP/qa-report"

      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/qa-report/report/report.md" ]; then
            cat "$RUNNER_TEMP/qa-report/report/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report: the test desktop did not start." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Shell log (only when a check failed)
        if: failure()
        run: |
          for f in shell.log apply.txt; do
            [ -f "$RUNNER_TEMP/qa-report/$f" ] || continue
            echo "::group::$f (last 300 lines)"
            tail -n 300 "$RUNNER_TEMP/qa-report/$f"
            echo "::endgroup::"
          done

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: stock-check-report-gnome${{ matrix.gnome }}${{ matrix.dock && '-dock' || '' }}
          path: |
            ${{ runner.temp }}/qa-report/report/
            ${{ runner.temp }}/qa-report/*.log
            ${{ runner.temp }}/qa-report/*.txt
          retention-days: 14
          if-no-files-found: warn

  # The glass login screen on a real login screen: GNOME Shell in its login (gdm) mode with
  # the add-on switched on by the real root helper. Checks that the glass shows, that the
  # password prompt still works under it, and that it leaves the plain login screen alone
  # after a crash, a broken look or High Contrast. A real GDM start with a real login runs
  # in login-boot.yml (the "login-boot" label).
  login:
    needs: image
    name: Glass login screen, GNOME ${{ matrix.gnome }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gnome: ["50", "51"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/test-image
        with:
          gnome: ${{ matrix.gnome }}
          mode: load

      - name: Run the login screen checks
        run: qa/desktop/run.sh --gnome "${{ matrix.gnome }}" --login-screen --out "$RUNNER_TEMP/qa-report"

      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/qa-report/report/report.md" ]; then
            cat "$RUNNER_TEMP/qa-report/report/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report: the test login screen did not start." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Shell log (only when a check failed)
        if: failure()
        run: |
          for f in shell.log; do
            [ -f "$RUNNER_TEMP/qa-report/$f" ] || continue
            echo "::group::$f (last 300 lines)"
            tail -n 300 "$RUNNER_TEMP/qa-report/$f"
            echo "::endgroup::"
          done

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: login-check-report-gnome${{ matrix.gnome }}
          path: |
            ${{ runner.temp }}/qa-report/report/
            ${{ runner.temp }}/qa-report/*.log
            ${{ runner.temp }}/qa-report/*.txt
          retention-days: 14
          if-no-files-found: warn

# Release checks on a test desktop like Dino's (see qa/desktop/README.md).
#
# Runs before every release (release.yml calls it and only builds the RPM when it
# passes), by hand from the Actions tab, and on a pull request only when it has the
# "release-checks" label, so ordinary pushes cost nothing.
name: Release checks

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release-checks')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Run the checks
        run: qa/desktop/run.sh --out "$RUNNER_TEMP/qa-report"

      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/qa-report/report/report.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No report: the test desktop did not start." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-check-report
          path: |
            ${{ runner.temp }}/qa-report/report/
            ${{ runner.temp }}/qa-report/*.log
            ${{ runner.temp }}/qa-report/*.txt
            ${{ runner.temp }}/qa-report/*.json
          retention-days: 14
          if-no-files-found: warn

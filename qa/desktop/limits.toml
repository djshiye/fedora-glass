# Pass/fail limits for the Fedora Glass release checks.
#
# The test desktop renders on the processor (no graphics card), so speed limits compare
# glass on with glass off in the same run instead of using absolute numbers.
# Change a limit only on purpose, with the reason in the commit message.

[looks]
# A pixel counts as "changed" when any colour channel moved more than this (0-255).
pixel_threshold = 40
# Average brightness change over the whole picture (0-255).
max_mean_brightness_change = 4.0
# Share of pixels that changed a lot.
max_changed_share = 0.015
# Biggest single patch of changed pixels, in screen pixels (a 40 x 40 box is 1600).
max_changed_patch = 1600
# Window glass with the window's own content hidden must keep at least this share of the
# brightness of the wallpaper under it (1.3.0's black glass kept about 1 %).
min_glass_vs_wallpaper = 0.55

[leftovers]
# Pixels of a window's colour allowed outside where that window is now.
max_stray_pixels = 60
# Biggest patch that differs from a freshly drawn screen, in screen pixels.
max_stale_patch = 900
max_stale_share = 0.004
# The strip of the first screen next to the edge with a window maximized on the second
# screen: share of pixels that may change by more than the threshold (1.4.3: about 30 %).
seam_pixel_threshold = 12
max_seam_changed_share = 0.03

[resize]
# How far a window's picture may sit from where GNOME says the window is (screen pixels).
max_surface_offset = 3
# How far an app's content may move away from the window's top-left corner while the
# window is resized, compared with before (screen pixels). Terminals line their text up
# on a grid, so up to about one character cell is normal; "the middle" is hundreds.
max_content_drift = 30

[speed]
# Frames painted while nothing moves, per 10 seconds (should be close to 0).
max_idle_frames = 6
# Redraws per second of the busiest piece of glass while nothing moves.
max_idle_glass_redraws = 0.5
# Redraws per second of glass that a busy, streaming window does not touch.
max_unrelated_glass_redraws = 1.0
# Redraws per second of a panel's glass while the pointer moves near it. The pointer only
# moves the light on the rim; 1.5.3 re-rendered the whole glass for it (about 12 a second).
max_pointer_glass_redraws = 1.0

[restart]
# Seconds every extension gets to come back after one is switched off and on.
settle_seconds = 25

[lock]
max_mean_brightness_change = 5.0
max_changed_patch = 2500
max_changed_share = 0.02

[popups]
# The volume pop-up and Alt+Tab: the most of their own fill that may cover the glass
# under them (Fedora Glass draws about 30 %; Just Perfection's theme paints 99-100 %).
max_surface_alpha = 0.6
# gedit's title bar corners: how much brighter than the desktop beside them the square
# corner just outside the rounded one may be (0-255; the 1.5.2 square corners were about 13).
max_corner_lift = 6

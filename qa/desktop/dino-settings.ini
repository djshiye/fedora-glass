# Dino's panel, menu and blur settings (layout keys only), from their PC on 2026-11-02.
# Personal lists (pinned and recent apps, saved window positions) are left out.
# Per-screen keys use "0" and "1" (the two test screens), which Dash to Panel falls back to.

[appindicator]
compact-mode-enabled=true
icon-brightness=0.0
icon-contrast=0.0
icon-opacity=240
icon-saturation=0.0
icon-size=0
legacy-tray-enabled=true
tray-pos='right'

[arcmenu]
menu-background-color='rgba(48,48,49,0.98)'
menu-border-color='rgb(60,60,60)'
menu-button-icon='resource:///org/gnome/shell/extensions/arcmenu/icons/scalable/actions/distro-fedora-symbolic.svg'
menu-button-icon-size=30
menu-button-padding=-1
menu-foreground-color='rgb(223,223,223)'
menu-item-active-bg-color='rgb(25,98,163)'
menu-item-active-fg-color='rgb(255,255,255)'
menu-item-hover-bg-color='rgb(21,83,158)'
menu-item-hover-fg-color='rgb(255,255,255)'
menu-layout='arcmenu'
menu-separator-color='rgba(255,255,255,0.1)'
override-menu-theme=false
power-options=[(0, false), (1, true), (2, true), (3, true), (4, false), (5, false), (6, false), (7, false)]
search-entry-border-radius=(true, 25)
update-notifier-project-version=74

[blur-my-shell]

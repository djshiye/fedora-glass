corner-when-maximized=false
dynamic-opacity=true
enable-all=false
opacity=123
pipeline='pipeline_08367353919921'
static-blur=true
whitelist=@as []

[blur-my-shell/dash-to-panel]
blur-original-panel=true

[blur-my-shell/lockscreen]
pipeline='pipeline_default_rounded'

[blur-my-shell/overview]
